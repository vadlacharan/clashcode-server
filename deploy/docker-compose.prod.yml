# Syntax School — production stack for a single Azure VM.
# Postgres comes from Supabase (external), everything else runs here:
# backend (API + admin + Socket.IO), workers (BullMQ), frontend (Next),
# Redis, Piston (privileged — needs a real Docker VM), Caddy (TLS proxy).

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  backend:
    build: ../backend
    restart: unless-stopped
    env_file:
      - ../backend/.env.production
    environment:
      REDIS_URL: redis://redis:6379
      PISTON_URL: http://piston:2000
      JUDGE_PROVIDER: piston
      PORT: '3000'
    depends_on:
      - redis
      - piston
    # Production requires proper schema migrations before the server starts.
    command: ['sh', '-c', 'npm run payload migrate && npm run start']

  workers:
    build: ../backend
    restart: unless-stopped
    env_file:
      - ../backend/.env.production
    environment:
      REDIS_URL: redis://redis:6379
      PISTON_URL: http://piston:2000
      JUDGE_PROVIDER: piston
    command: ['npm', 'run', 'workers']
    depends_on:
      - backend
      - redis

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      PORT: '3001'
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Internal only — no host port. Matchmaking/queues/rate limits/pub-sub.
    volumes:
      - redis_data:/data

  piston:
    image: ghcr.io/engineer-man/piston
    restart: unless-stopped
    privileged: true # isolate sandbox — only works on real Docker VMs
    environment:
      PISTON_RUN_TIMEOUT: '15000'
      PISTON_COMPILE_TIMEOUT: '15000'
      PISTON_OUTPUT_MAX_SIZE: '65536'
    volumes:
      - piston_packages:/piston/packages
    tmpfs:
      - /tmp:exec

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  piston_packages:
