services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clashcode
      POSTGRES_PASSWORD: clashcode
      POSTGRES_DB: clashcode
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clashcode']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  piston:
    image: ghcr.io/engineer-man/piston
    restart: unless-stopped
    privileged: true
    environment:
      PISTON_RUN_TIMEOUT: '15000'
      PISTON_COMPILE_TIMEOUT: '15000'
      PISTON_OUTPUT_MAX_SIZE: '65536'
    ports:
      - '2000:2000'
    volumes:
      - piston_packages:/piston/packages
    tmpfs:
      - /tmp:exec

volumes:
  pgdata:
  piston_packages:
