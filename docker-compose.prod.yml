# Syntax School — production stack for a single Azure VM.
# Postgres comes from Supabase (external), the frontend deploys on Vercel
# (separate), and everything else runs here:
# backend (API + admin + Socket.IO), workers (BullMQ), Redis,
# Piston (privileged — needs a real Docker VM), Caddy (TLS proxy for the API).
#
# Run from the REPO ROOT (where this file lives):
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      REDIS_URL: redis://redis:6379
      PISTON_URL: http://piston:2000
      JUDGE_PROVIDER: piston
      PORT: '3000'
    depends_on:
      - redis
      - piston
    # Production requires proper schema migrations before the server starts.
    command: ['sh', '-c', 'npm run payload migrate && npm run start']

  workers:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      REDIS_URL: redis://redis:6379
      PISTON_URL: http://piston:2000
      JUDGE_PROVIDER: piston
    command: ['npm', 'run', 'workers']
    depends_on:
      - backend
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Internal only — no host port. Matchmaking/queues/rate limits/pub-sub.
    volumes:
      - redis_data:/data

  piston:
    image: ghcr.io/engineer-man/piston
    restart: unless-stopped
    privileged: true # isolate sandbox — only works on real Docker VMs
    environment:
      PISTON_RUN_TIMEOUT: '15000'
      PISTON_COMPILE_TIMEOUT: '15000'
      PISTON_OUTPUT_MAX_SIZE: '65536'
    volumes:
      - piston_packages:/piston/packages
    tmpfs:
      - /tmp:exec

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  piston_packages:
